# Publishes the game (duskwell/) at the root of the site, with the Android build under /download.
name: Publish the game
on:
  push:
    branches: [main]
    paths: ['duskwell/**', 'duskwell-android/duskwell.apk', 'duskwell-android/duskwell-apk.zip', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir _site
          # the game without its source sheets, tests and tools
          rsync -a --exclude=art/source --exclude=tests --exclude=tools --exclude=docs --exclude=unity --exclude=tools-dump.js --exclude='*.md' duskwell/ _site/
          mkdir _site/download
          cp duskwell-android/duskwell.apk duskwell-android/duskwell-apk.zip _site/download/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
