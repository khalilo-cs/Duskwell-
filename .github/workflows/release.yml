# Puts the Android build of Duskwell on the releases page.
name: Publish release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 2.9 duskwell-android/duskwell.apk duskwell-android/duskwell-apk.zip \
            --target "$GITHUB_SHA" --title "Duskwell 2.9" --latest \
            --notes "Android build of Duskwell 2.9 (versionCode 20). Teaching the moves in the game: a banner that plays the move's effect and says its keys, a tip at the foot of the screen until the move is done once, a mark in the pause menu and on the Moves screen, and a training post in the village by the smith. It installs over the earlier versions and keeps the save."
