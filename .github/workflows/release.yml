# Puts the Android build of Duskwell on the releases page.
name: Publish release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 3.2 duskwell-android/duskwell.apk duskwell-android/duskwell-apk.zip \
            --target "$GITHUB_SHA" --title "Duskwell 3.2" --latest \
            --notes "Android build of Duskwell 3.2 (versionCode 23). Eye comfort: three levels (Standard, Soft, Softest) that take saturation and contrast out of the picture and tone down the white flashes, the screen shake, the glow and the lightning. Soft is the default; change it from the title menu or the pause menu. The volume of the effects moved to the music screen. It installs over the earlier versions and keeps the save."
