# Puts the Android build of Duskwell on the releases page, so it can be downloaded with one direct link.
name: Publish release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.3 duskwell-android/duskwell.apk duskwell-android/duskwell-apk.zip \
            --target "$GITHUB_SHA" --title "Duskwell 2.3" \
            --notes "Android build of Duskwell 2.3 (versionCode 14). It installs over the earlier versions and keeps the save."
