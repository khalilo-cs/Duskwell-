# Puts the Android build of Duskwell on the releases page.
name: Publish release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 2.6 duskwell-android/duskwell.apk duskwell-android/duskwell-apk.zip \
            --target "$GITHUB_SHA" --title "Duskwell 2.6" --latest \
            --notes "Android build of Duskwell 2.6 (versionCode 17). A lighter difficulty, five new dark original pieces of music (merchants, forge, wizard, the road, menus), a closer picture during play, a soul vessel of 297, one mask per wound. It installs over the earlier versions and keeps the save."
