# Puts the Android build of Duskwell on the releases page.
name: Publish release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 2.7 duskwell-android/duskwell.apk duskwell-android/duskwell-apk.zip \
            --target "$GITHUB_SHA" --title "Duskwell 2.7" --latest \
            --notes "Android build of Duskwell 2.7 (versionCode 18). A Moves screen in the pause menu (Moon Rend, Dusk Rush, Soul Nova, Soul Dive, Comet Heart, each with its effect, keys and where to get it), cheaper arts at the smith, and a new map drawn from the rooms' own tiles with signs for benches, lanterns, merchants, wizards, the smith and the guardians, and room, area and world views. It installs over the earlier versions and keeps the save."
