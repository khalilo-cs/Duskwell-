# Puts the Android build of Duskwell on the releases page.
name: Publish release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 3.5 duskwell-android/duskwell.apk duskwell-android/duskwell-apk.zip \
            --target "$GITHUB_SHA" --title "Duskwell 3.5" --latest \
            --notes "Android build of Duskwell 3.5 (versionCode 26). The mossy stone tile sheet, all 116 pieces: the rooms of Mossgrove, Sporewood, the Aqueduct and Cinderdeep are now laid from its rock blocks (with moss, roots, windows, water and lava in them), ground tops with grass and mushrooms, hanging moss, arches, floating stone plates, pillars, windows, ruins, trees, crates, lanterns, banners and spikes. It installs over the earlier versions and keeps the save."
