# Puts the Android build of Duskwell on the releases page.
name: Publish release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 2.8 duskwell-android/duskwell.apk duskwell-android/duskwell-apk.zip \
            --target "$GITHUB_SHA" --title "Duskwell 2.8" --latest \
            --notes "Android build of Duskwell 2.8 (versionCode 19). Difficulty setting (easy, normal, hard) in the title and pause menus, touch for the map and the Moves screen (view chips, drag to move the map, tap a move, a round back button on the full-screen pages). It installs over the earlier versions and keeps the save."
