# Puts the Android build of Duskwell on the releases page.
name: Publish release
on:
  push:
    branches: [clean-main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 4.2 duskwell-android/duskwell.apk duskwell-android/duskwell-apk.zip \
            --target "$GITHUB_SHA" --title "Duskwell 4.2 - أرض الغسق" --latest \
            --notes "نسخة أندرويد 4.2 (versionCode 33): إصلاح التعليق والتقطيع. الدخول إلى الغرف صار أسرع بكثير (الكهوف الكبيرة من نحو 3 ثوانٍ إلى نصف ثانية تقريباً، والمتاهات من 1.4 ثانية إلى 0.3)، والغرف الكبيرة ترسم على قطع يحتملها معالج رسوميات الجوال، والمؤثرات اللونية تحسب مرة واحدة بدل كل إطار، والإضاءات والقارورة والكائنات الحية ترسم بتكلفة أقل، والأصوات تمر عبر محرك الصوت بدل مشغل جديد لكل صوت، وإذا لم يلحق الجوال تنخفض دقة الرسم قليلاً تلقائياً لتبقى اللعبة سلسة. تثبت فوق النسخ السابقة ويبقى الحفظ. — Android build 4.2: fixes the freezes and stutter. Installs over earlier versions and keeps the save."
