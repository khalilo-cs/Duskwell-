# Puts the Android build of Duskwell on the releases page.
name: Publish release
on:
  push:
    branches: [clean-main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 4.5 duskwell-android/duskwell.apk duskwell-android/duskwell-apk.zip \
            --target "$GITHUB_SHA" --title "Duskwell 4.5 - أرض الغسق" --latest \
            --notes "نسخة أندرويد 4.5 (versionCode 36): حركة ممزوجة بين خطوات اللعبة، فالبطل والوحوش والكاميرا يرسمون في مواضع وسيطة بين كل خطوتين، فتصير الحركة ناعمة على شاشات 60 و90 و120 هرتز مثل محركات الألعاب الحديثة؛ وظل خفيف على أطراف الشاشة يعطي عمقاً. مع كل تحسينات 4.4. تثبت فوق النسخ السابقة ويبقى الحفظ. — Android build 4.5: motion blended between steps (smooth on 90 and 120 Hz screens) and shadowed view edges. Installs over earlier versions and keeps the save."
