# Puts the Android build of Duskwell on the releases page.
name: Publish release
on:
  push:
    branches: [clean-main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 4.1 duskwell-android/duskwell.apk duskwell-android/duskwell-apk.zip \
            --target "$GITHUB_SHA" --title "Duskwell 4.1 - أرض الغسق" --latest \
            --notes "نسخة أندرويد 4.1 من أرض الغسق (versionCode 32). لكل منطقة من المناطق الأربع عشرة متاهة تحتها بخلفية كهف مرسومة خاصة بها، وكهف واسع وبرج، وحجرات بأسقف متعرجة وأقواس كهوف مرسومة، وصخور داكنة مرسومة في مقدمة المشهد في كل المناطق. وفيها إصلاحات: لا يُدفن وحش داخل الصخر، والزعماء يفكرون كما يجب، والموسيقى بمقاماتها، وعباءة الحكيم تتحرك، والوحوش الجديدة تتكسر عند موتها. تُثبَّت فوق النسخ السابقة ويبقى الحفظ. — Android build 4.1: a painted labyrinth under every area, wider caverns, painted foreground rock, and fixes. Installs over earlier versions and keeps the save."
