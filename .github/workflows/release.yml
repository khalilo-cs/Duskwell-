# Puts the Android build of Duskwell on the releases page.
name: Publish release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 3.0 duskwell-android/duskwell.apk duskwell-android/duskwell-apk.zip \
            --target "$GITHUB_SHA" --title "Duskwell 3.0" --latest \
            --notes "Android build of Duskwell 3.0 (versionCode 21). Side quests for the merchants, the travelling traders and the wizards: thirteen quests (collect things, kill creatures, visit rooms, carry letters, beat a guardian), a gold ! over whoever has work, dialogs with choices, a quest log in the pause menu, marks on the map, geo rewards and four lasting perks. It installs over the earlier versions and keeps the save."
