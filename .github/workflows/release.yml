# Puts the Android build of Duskwell on the releases page.
name: Publish release
on:
  push:
    branches: [clean-main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 4.6 duskwell-android/duskwell.apk duskwell-android/duskwell-apk.zip \
            --target "$GITHUB_SHA" --title "Duskwell 4.6 - أرض الغسق" --latest \
            --notes "نسخة أندرويد 4.6 (versionCode 37): أصوات جديدة كلها: الشخصيات والزعماء يتكلمون بلغة خيالية مهمهمة مع بقاء الترجمة مكتوبة، صرخات جديدة لكل وحش، وأصوات جديدة للسيف والضربات والانفجار والعملات والشفاء والأجواء. حركة نابضة للوحوش والزعماء (تجمّع قبل الهجوم، تمدد عند القفز، انضغاط عند الهبوط، ارتداد عند الضربة، ميل أثناء الجري). أسقف وجدران الغرف صارت متعرجة بأشكال مختلفة في 111 غرفة. تثبت فوق النسخ السابقة ويبقى الحفظ. — Android build 4.6: new wordless voices and effects, spring motion for creatures and bosses, jagged room outlines."
