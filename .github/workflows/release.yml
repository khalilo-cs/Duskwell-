# Puts the Android build of Duskwell on the releases page.
name: Publish release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 3.3 duskwell-android/duskwell.apk duskwell-android/duskwell-apk.zip \
            --target "$GITHUB_SHA" --title "Duskwell 3.3" --latest \
            --notes "Android build of Duskwell 3.3 (versionCode 24). Fixes the hero and the creatures vanishing after the Storm Roc: its drawing asked for a pose it does not have, which broke the drawing layer for the rest of the game. A draw guard now keeps one failing drawing from hiding the rest. It installs over the earlier versions and keeps the save."
