# Puts the Android build of Duskwell on the releases page.
name: Publish release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 2.4 duskwell-android/duskwell.apk duskwell-android/duskwell-apk.zip \
            --target "$GITHUB_SHA" --title "Duskwell 2.4" --latest \
            --notes "Android build of Duskwell 2.4 (versionCode 15). A soul vessel of 297 that fills slowly, harder and cleverer creatures, one mask per wound. It installs over the earlier versions and keeps the save."
