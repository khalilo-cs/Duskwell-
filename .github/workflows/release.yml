# Puts the Android build of Duskwell on the releases page.
name: Publish release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 3.7 duskwell-android/duskwell.apk duskwell-android/duskwell-apk.zip \
            --target "$GITHUB_SHA" --title "Duskwell 3.7" --latest \
            --notes "Android build of Duskwell 3.7 (versionCode 28). The movement of the hero and the creatures is tuned to the feel of Hollow-Knight-like games (no picture or sound of that game is used): the run keeps pace with the ground instead of spinning the legs, dust comes up at the first step, every stride, a turn and a long fall, and the walkers stop a quarter of a second at a ledge and look round before they turn; a husk that first sees you stops and faces you, and rests after its leap. The jump, fall and dash numbers were already where such games have them and the rooms are built on them, so they are kept. It installs over the earlier versions and keeps the save."
