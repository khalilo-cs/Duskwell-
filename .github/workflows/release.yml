# Puts the Android build of Duskwell on the releases page, then clears the older runs from the Actions tab.
name: Publish release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 2.3 duskwell-android/duskwell.apk duskwell-android/duskwell-apk.zip \
            --target "$GITHUB_SHA" --title "Duskwell 2.3" --latest \
            --notes "Android build of Duskwell 2.3 (versionCode 14). It installs over the earlier versions and keeps the save."
      - name: Clear the older runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for i in 1 2 3; do
            ids=$(gh run list --limit 200 --json databaseId,status --jq '.[] | select(.status=="completed") | .databaseId')
            [ -z "$ids" ] && break
            for id in $ids; do gh run delete "$id" || true; done
          done
