# Puts the Android build of Duskwell on the releases page.
name: Publish release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 3.6 duskwell-android/duskwell.apk duskwell-android/duskwell-apk.zip \
            --target "$GITHUB_SHA" --title "Duskwell 3.6" --latest \
            --notes "Android build of Duskwell 3.6 (versionCode 27). Completes the mossy stone tile sheet after a piece-by-piece check against the picture: a whole block of stones and a small spire that had been left out are in, and the cut of twenty pieces is wider (the grass on the floors, the spray of the falls). The atlas has 117 pieces and covers about 99.5% of the sheet; what is left are slivers of edges. It installs over the earlier versions and keeps the save."
