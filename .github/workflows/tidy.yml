# One-off: removes the first release (tag v2.3) and clears the finished runs from the Actions tab.
name: Tidy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tidy.yml']
permissions:
  contents: write
  actions: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete v2.3 --cleanup-tag --yes || true
          for i in 1 2 3; do
            ids=$(gh run list --limit 200 --json databaseId,status --jq '.[] | select(.status=="completed") | .databaseId')
            [ -z "$ids" ] && break
            for id in $ids; do gh run delete "$id" || true; done
          done
          gh release list
