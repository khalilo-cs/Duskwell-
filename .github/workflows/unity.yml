# Builds the Unity version of Duskwell for Android (needs the secrets UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD).
name: Build the Unity version
on:
  workflow_dispatch:
  push:
    branches: [clean-main]
    paths: ['duskwell-unity/**', '.github/workflows/unity.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@main
        with: { tool-cache: false, android: false, dotnet: true, haskell: true, large-packages: false, swap-storage: false }
      - uses: actions/checkout@v4
        with: { sparse-checkout: duskwell-unity }
      - uses: actions/cache@v4
        with: { path: duskwell-unity/Library, key: unity-library-android }
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: duskwell-unity
          targetPlatform: Android
          buildMethod: Build.Android
          buildName: duskwell-unity
          allowDirtyBuild: true
      - uses: actions/upload-artifact@v4
        with: { name: duskwell-unity-apk, path: build/Android }
