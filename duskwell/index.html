<title>أرض الغسق - Duskwell</title>

<meta name="description" content="Duskwell: a dark hand-inked Metroidvania with bosses, abilities, benches and a world to explore.">
<meta name="theme-color" content="#05070d">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one 16:9 stage centred on a near-black page; touch pads appear only on coarse pointers. */
:root{
  color-scheme:dark;
  --ink:#05070d;        /* page ground */
  --stage:#000;         /* canvas letterbox */
  --text:#e6eefa;
  --reserve:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);overflow:hidden;font-family:"Cairo","Segoe UI",Tahoma,sans-serif}
/* the picture of the title, dim and blurred, fills the page around the game */
body::before{content:"";position:fixed;inset:-12px;z-index:-1;background:linear-gradient(rgba(5,7,13,.7),rgba(5,7,13,.88)),url(art/title/banner.webp) center/cover no-repeat;filter:blur(7px) saturate(.85)}
#app{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;padding-inline:8px}
#wrap{position:relative;line-height:0}
canvas{display:block;background:var(--stage);border-radius:4px;box-shadow:0 0 40px rgba(0,0,0,.6);
  width:min(100vw - 16px,(100dvh - 16px - var(--reserve))*16/9);aspect-ratio:16/9;height:auto;outline:none}
#touch{display:none;width:100%;max-width:760px;justify-content:space-between;align-items:flex-end;direction:ltr;padding-bottom:4px}
.cluster{display:grid;gap:8px;align-items:center;justify-items:center}
/* a cross with an empty centre: the thumb slides over it to change direction (see bindTouch in input.js) */
.dpad{grid-template-columns:auto 26px auto;grid-template-rows:auto 26px auto;grid-template-areas:". up ." "left . right" ". down .";gap:6px;padding:10px;margin:-10px}
.face{grid-template-columns:repeat(3,auto);grid-template-areas:". cast superdash" "dash attack jump"}
.b{
  --acc:#a9bdd6;--glow:rgba(150,185,215,.5);
  position:relative;width:58px;height:58px;border-radius:50%;color:var(--acc);
  display:flex;align-items:center;justify-content:center;
  /* dark medallion face with a soft light from above */
  background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.16),transparent 55%),radial-gradient(circle at 50% 58%,#17323d 0,#0c1921 62%,#070d13 100%);
  box-shadow:inset 0 0 0 3px #05080c,inset 0 -7px 12px rgba(0,0,0,.45),0 3px 8px rgba(0,0,0,.55),0 0 14px var(--glow);
  transition:transform .06s,box-shadow .06s}
/* silver rim around the medallion */
.b::before{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 200deg,#e2eaf3,#7d90a5 18%,#2f3b49 38%,#a8b9cc 58%,#e8eef6 72%,#566a7e 88%,#e2eaf3);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4.5px),#000 calc(100% - 4px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 4.5px),#000 calc(100% - 4px))}
.b svg{width:56%;height:56%;pointer-events:none;filter:drop-shadow(0 0 3px var(--glow))}
.b.on{transform:scale(.93);box-shadow:inset 0 0 0 3px #05080c,inset 0 0 16px var(--glow),0 0 22px var(--glow)}
.b.on svg{filter:drop-shadow(0 0 7px var(--acc)) brightness(1.25)}
.b.big{width:66px;height:66px}
/* each action has its own glow colour */
[data-act=jump]{--acc:#8fe6ff;--glow:rgba(110,215,255,.55)}
[data-act=attack]{--acc:#eef3fb;--glow:rgba(220,232,250,.5)}
[data-act=dash]{--acc:#ffbd6a;--glow:rgba(255,165,80,.5)}
[data-act=cast]{--acc:#8ff0d8;--glow:rgba(100,235,200,.55)}
[data-act=superdash]{--acc:#ff9060;--glow:rgba(255,115,70,.55)}
[data-act=map]{--acc:#ecd9a0;--glow:rgba(235,210,140,.45)}
/* the arrow glyph points up; the other directions turn it */
[data-act=right] svg{transform:rotate(90deg)}[data-act=down] svg{transform:rotate(180deg)}[data-act=left] svg{transform:rotate(-90deg)}
[data-act=up]{grid-area:up}[data-act=down]{grid-area:down}[data-act=left]{grid-area:left}[data-act=right]{grid-area:right}
[data-act=jump]{grid-area:jump}[data-act=attack]{grid-area:attack}[data-act=dash]{grid-area:dash}[data-act=cast]{grid-area:cast}[data-act=superdash]{grid-area:superdash}
.b[hidden]{display:none}
.sys{display:flex;gap:10px;align-self:flex-start}
.sys .b{width:42px;height:42px}
@media (pointer:coarse){#touch{display:flex}:root{--reserve:170px}}
@media (pointer:coarse) and (orientation:landscape){
  :root{--reserve:0px}
  #app{padding:0;gap:0}
  #touch{position:fixed;inset:0;max-width:none;padding:0 calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));pointer-events:none}
  #touch .b{pointer-events:auto}
  #touch .sys{position:absolute;top:8px;right:calc(14px + env(safe-area-inset-right))}
  .b{width:52px;height:52px}.b.big{width:60px;height:60px}
}
@media (pointer:coarse) and (orientation:portrait){
  :root{--reserve:250px}
  #touch{flex-wrap:wrap;row-gap:12px;padding-inline:4px}
  #touch .sys{order:-1;width:100%;justify-content:flex-end}
  .cluster{gap:7px}
  .b{width:46px;height:46px}.b.big{width:52px;height:52px}
}
@media (prefers-reduced-motion:reduce){.b{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="wrap"><canvas id="c" tabindex="0" aria-label="Duskwell game"></canvas></div>
  <!-- touch buttons: painted medallions with drawn glyphs (no letters) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>

      <symbol id="g-attack" viewBox="0 0 48 48"><g transform="rotate(45 24 24)"><path d="M24 1 L28.5 7 V29 H19.5 V7 Z" fill="currentColor"/><path d="M24 1 L28.5 7 V29 H24 Z" fill="#fff" opacity=".35"/><rect x="12" y="29" width="24" height="4.5" rx="2" fill="currentColor"/><rect x="21.5" y="33.5" width="5" height="8" rx="1.5" fill="currentColor" opacity=".75"/><circle cx="24" cy="44" r="3" fill="currentColor"/></g></symbol>
      <symbol id="g-dash" viewBox="0 0 48 48"><rect x="3" y="14" width="14" height="3.5" rx="1.7" fill="currentColor" opacity=".45"/><rect x="1" y="22.3" width="17" height="3.5" rx="1.7" fill="currentColor" opacity=".75"/><rect x="5" y="30.5" width="12" height="3.5" rx="1.7" fill="currentColor" opacity=".45"/><path d="M22 8 L41 24 L22 40 L22 31 L29 24 L22 17 Z" fill="currentColor"/><path d="M24 14 L33 24 L24 24 Z" fill="#fff" opacity=".3"/></symbol>
      <symbol id="g-cast" viewBox="0 0 48 48"><path d="M24 3 C27 13 38 18 38 30 C38 38.5 31.5 44 24 44 C16.5 44 10 38.5 10 30 C10 22 16 19 18 11 C20 14 21 15 24 3 Z" fill="currentColor"/><path d="M24 20 C26 26 32 28 32 34 C32 38 28.5 41 24 41 C19.5 41 16 38 16 34 C16 30 21 28 22 23 Z" fill="#fff" opacity=".4"/></symbol>
      <symbol id="g-super" viewBox="0 0 48 48"><path d="M27 27 L2 3 L12 25 Z" fill="currentColor" opacity=".7"/><path d="M24 33 L1 25 L14 28 Z" fill="currentColor" opacity=".55"/><path d="M28 24 L21 1 L30 20 Z" fill="currentColor" opacity=".55"/><circle cx="31" cy="31" r="11" fill="currentColor"/><circle cx="28" cy="28" r="4.5" fill="#fff" opacity=".45"/></symbol>
      <symbol id="g-map" viewBox="0 0 48 48"><path d="M5 11 L17 7 L31 11 L43 7 V37 L31 41 L17 37 L5 41 Z" fill="currentColor"/><path d="M17 7 V37 M31 11 V41" stroke="#0a131b" stroke-width="2" fill="none" opacity=".7"/><circle cx="24" cy="22" r="3.4" fill="#0a131b" opacity=".8"/></symbol>
      <symbol id="g-pause" viewBox="0 0 48 48"><rect x="11" y="8" width="9" height="32" rx="3" fill="currentColor"/><rect x="28" y="8" width="9" height="32" rx="3" fill="currentColor"/><rect x="13" y="11" width="3" height="22" rx="1.5" fill="#fff" opacity=".3"/><rect x="30" y="11" width="3" height="22" rx="1.5" fill="#fff" opacity=".3"/></symbol>
    </defs>
  </svg>
  <div id="touch">
    <div class="cluster dpad">
      <div class="b" data-act="up"><svg><use href="#g-arrow"/></svg></div>
      <div class="b big" data-act="left"><svg><use href="#g-arrow"/></svg></div>
      <div class="b" data-act="down"><svg><use href="#g-arrow"/></svg></div>
      <div class="b big" data-act="right"><svg><use href="#g-arrow"/></svg></div>
    </div>
    <div class="sys"><div class="b" data-act="map"><svg><use href="#g-map"/></svg></div><div class="b" data-act="pause"><svg><use href="#g-pause"/></svg></div></div>
    <div class="cluster face">
      <div class="b" data-act="cast"><svg><use href="#g-cast"/></svg></div>
      <div class="b" data-act="superdash" hidden><svg><use href="#g-super"/></svg></div>
      <div class="b" data-act="dash"><svg><use href="#g-dash"/></svg></div>
      <div class="b big" data-act="attack"><svg><use href="#g-attack"/></svg></div>
      <div class="b big" data-act="jump"><svg><use href="#g-jump"/></svg></div>
    </div>
  </div>
</div>
